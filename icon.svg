  <!-- 两侧点缀：单词飘片 -->
  <text x="120" y="180" font-family="serif" font-size="44" font-weight="bold" fill="#2E4E68" transform="rotate(-12 120 180)">A</text>
  <text x="372" y="240" font-family="serif" font-size="44" font-weight="bold" fill="#C23A2B" transform="rotate(10 372 240)">a</text>
